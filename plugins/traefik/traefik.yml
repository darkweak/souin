providers:
  file:
    filename: /souin-configuration.yaml
    watch: true

api:
  dashboard: true
  debug: true
  insecure: true

experimental:
  # Souin runs on wy, not Yaegi: it needs the darkweak/traefik fork, or a
  # Traefik with traefik/traefik#14293.
  defaultRuntimeVersion: wy
  localPlugins:
    souin:
      moduleName: github.com/darkweak/souin
      settings:
        # The storages rely on unsafe, see useUnsafe in .traefik.yml.
        useUnsafe: true

log:
  level: DEBUG

accessLog: {}
