providers:
  file:
    filename: /souin-configuration.yaml
    watch: true

api:
  dashboard: true
  debug: true
  insecure: true

experimental:
  localPlugins:
    souin:
      moduleName: github.com/darkweak/souin
      settings:
        # The storages rely on unsafe, see useUnsafe in .traefik.yml.
        useUnsafe: true

log:
  level: DEBUG

accessLog: {}
